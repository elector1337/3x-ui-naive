name: CI

on:
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "**.js"
      - "**.mjs"
      - "**.cjs"
      - "**.ts"
      - "**.vue"
      - "**.html"
      - "**.css"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".nvmrc"
  push:
    branches:
      - main
      - feature/naive-proxy
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "**.js"
      - "**.mjs"
      - "**.cjs"
      - "**.ts"
      - "**.vue"
      - "**.html"
      - "**.css"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".nvmrc"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Stub web/dist for go:embed
        run: mkdir -p web/dist && touch web/dist/.gitkeep
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt-formatted:"
            echo "$unformatted"
            echo "Run: gofmt -w ."
            exit 1
          fi
      - name: go vet
        run: |
          go list ./... | grep -v '/frontend/node_modules/' > /tmp/go-packages.txt
          go vet $(cat /tmp/go-packages.txt)
      # NOTE: install via `go install` (not golangci-lint-action) on purpose.
      # The action ships prebuilt binaries built with an older Go toolchain,
      # which refuse to lint a module that targets a newer `go` directive
      # (see go.mod). Building with the repo's toolchain keeps them in sync.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.6.2
      - name: golangci-lint
        run: golangci-lint run ./...

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Stub web/dist for go:embed
        run: mkdir -p web/dist && touch web/dist/.gitkeep
      - name: Test
        run: |
          go list ./... | grep -v '/frontend/node_modules/' > /tmp/go-packages.txt
          go test $(cat /tmp/go-packages.txt)

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Stub web/dist for go:embed
        run: mkdir -p web/dist && touch web/dist/.gitkeep
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
      - name: Audit
        run: npm audit --audit-level=high
        working-directory: frontend
